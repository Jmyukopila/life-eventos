[project]
name = "life-iglesia-eventos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2.15,<5.3",
    "django-axes>=7.0.2",
    "pillow>=11.0.0",
    "whitenoise>=6.8.2",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2",
]

[tool.uv]
exclude-newer = "2026-09-02T00:00:00Z"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
