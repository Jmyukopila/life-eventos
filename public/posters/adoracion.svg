<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <defs>
    <linearGradient id="bg-adoracion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a10" />
      <stop offset="50%" stop-color="#0a1522" />
      <stop offset="100%" stop-color="#020407" />
    </linearGradient>
    <linearGradient id="wave-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087f86" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#087f86" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="wave-grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#087f86" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="adoracion-glow" cx="65%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#087f86" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0a1522" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050a10" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="720" fill="url(#bg-adoracion)" />
  <circle cx="680" cy="360" r="300" fill="url(#adoracion-glow)" />

  <g stroke-linecap="round" fill="none">
    <path d="M 450 180 C 580 80, 720 280, 960 160" stroke="url(#wave-grad1)" stroke-width="3" />
    <path d="M 420 220 C 560 120, 700 320, 970 200" stroke="url(#wave-grad2)" stroke-width="2" />
    <path d="M 400 270 C 540 170, 680 370, 980 250" stroke="#087f86" stroke-opacity="0.4" stroke-width="1.5" />

    <path d="M 380 330 C 530 230, 670 430, 990 310" stroke="url(#wave-grad1)" stroke-width="3.5" />
    <path d="M 370 380 C 520 280, 660 480, 990 360" stroke="url(#wave-grad2)" stroke-width="2" />

    <path d="M 390 440 C 540 340, 680 540, 980 420" stroke="#087f86" stroke-opacity="0.5" stroke-width="2.5" />
    <path d="M 420 490 C 570 390, 710 590, 970 470" stroke="url(#wave-grad1)" stroke-width="1.8" />
    <path d="M 460 540 C 610 440, 750 640, 960 520" stroke="url(#wave-grad2)" stroke-width="1.2" />

    <circle cx="660" cy="350" r="140" stroke="#e8dcc4" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="660" cy="350" r="80" stroke="#087f86" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="660" cy="350" r="4" fill="#2dd4bf" />
  </g>

  <g stroke="#087f86" stroke-opacity="0.3" stroke-width="1">
    <line x1="60" y1="60" x2="160" y2="60" />
    <line x1="60" y1="60" x2="60" y2="160" />
    <line x1="940" y1="660" x2="840" y2="660" />
    <line x1="940" y1="660" x2="940" y2="560" />
  </g>

  <text x="80" y="115" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="6" fill="#087f86">NOCHE DE ADORACIÓN • LIFE WORSHIP</text>
  <text x="80" y="140" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#e8dcc4" fill-opacity="0.5">ENCUENTRO DE ALABANZA ÍNTIMA</text>

  <text x="76" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-style="italic" font-weight="400" fill="#fbf7ee" letter-spacing="-1">Una noche.</text>
  <text x="80" y="365" font-family="'Helvetica Neue', Arial, sans-serif" font-size="102" font-weight="900" fill="#2dd4bf" letter-spacing="-2">UNA VOZ.</text>

  <line x1="80" y1="430" x2="480" y2="430" stroke="#e8dcc4" stroke-opacity="0.25" stroke-width="1" />

  <text x="80" y="480" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#e8dcc4" letter-spacing="1">Un clamor unido en adoración, gratitud y búsqueda.</text>

  <g transform="translate(80, 530)">
    <text x="0" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#fbf7ee">VIERNES • 20:00 HORAS</text>
    <text x="0" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="2" fill="#087f86">AUDITORIO PRINCIPAL • TRANSMISIÓN EN VIVO</text>
  </g>

  <g transform="translate(80, 615)">
    <rect x="0" y="0" width="140" height="34" rx="4" fill="#087f86" />
    <text x="70" y="22" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#050a10">TRANSMISIÓN</text>
    <text x="160" y="22" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#e8dcc4">YOUTUBE &amp; EN VIVO</text>
  </g>

  <text x="80" y="675" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#2dd4bf" fill-opacity="0.8">«Dios es Espíritu; y los que le adoran, en espíritu y en verdad es necesario que adoren»</text>
</svg>
