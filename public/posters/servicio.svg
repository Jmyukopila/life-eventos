<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720">
  <defs>
    <linearGradient id="bg-servicio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182015" />
      <stop offset="60%" stop-color="#24301f" />
      <stop offset="100%" stop-color="#121810" />
    </linearGradient>
    <radialGradient id="leaf-glow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a5d3f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#24301f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="720" fill="url(#bg-servicio)" />
  <circle cx="720" cy="360" r="260" fill="url(#leaf-glow)" />

  <g transform="translate(710, 360)">
    <circle cx="0" cy="0" r="210" fill="none" stroke="#e8dcc4" stroke-opacity="0.15" stroke-width="1.2" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#a4b494" stroke-opacity="0.2" stroke-width="1" />

    <path d="M 0 190 Q -30 20 20 -180" fill="none" stroke="#a4b494" stroke-width="3" stroke-linecap="round" />

    <g fill="#e8dcc4" opacity="0.85">
      <path d="M 12 -140 Q 60 -160 80 -130 Q 50 -120 12 -140 Z" />
      <path d="M 0 -90 Q -60 -110 -70 -75 Q -40 -70 0 -90 Z" />
      <path d="M -8 -30 Q 65 -45 75 -15 Q 45 -10 -8 -30 Z" />
      <path d="M -18 30 Q -70 15 -80 45 Q -45 50 -18 30 Z" />
      <path d="M -15 90 Q 60 80 65 110 Q 35 115 -15 90 Z" />
      <path d="M -6 150 Q -50 140 -60 170 Q -30 170 -6 150 Z" />
    </g>

    <g fill="#d4a373" opacity="0.9">
      <circle cx="20" cy="-185" r="7" />
      <circle cx="90" cy="-130" r="5" />
      <circle cx="-80" cy="-75" r="5" />
      <circle cx="85" cy="-15" r="5" />
      <circle cx="-90" cy="45" r="5" />
      <circle cx="75" cy="110" r="5" />
      <circle cx="-70" cy="170" r="5" />
    </g>

    <path d="M -120 120 Q -40 80 0 190" fill="none" stroke="#a4b494" stroke-opacity="0.5" stroke-width="1.5" />
    <path d="M 100 130 Q 30 90 0 190" fill="none" stroke="#a4b494" stroke-opacity="0.5" stroke-width="1.5" />
  </g>

  <text x="80" y="110" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="5" fill="#a4b494">VOLUNTARIADO &amp; ACCIÓN SOCIAL</text>
  <line x1="80" y1="130" x2="420" y2="130" stroke="#a4b494" stroke-opacity="0.3" stroke-width="1" />

  <text x="76" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-style="italic" font-weight="400" fill="#f4efe6" letter-spacing="-1">Manos que</text>
  <text x="80" y="345" font-family="'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="900" fill="#a4b494" letter-spacing="-2">TRANSFORMAN.</text>

  <text x="80" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#d0ded0" letter-spacing="1">Sirviendo con amor a nuestra comunidad y ciudad.</text>

  <line x1="80" y1="460" x2="480" y2="460" stroke="#e8dcc4" stroke-opacity="0.2" stroke-width="1" />

  <g transform="translate(80, 505)">
    <text x="0" y="20" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#f4efe6">EQUIPOS DE SERVICIO LIFE</text>
    <text x="0" y="50" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="1" fill="#a4b494">Hospitalidad • Logística • Acción Social • Niños</text>
  </g>

  <g transform="translate(80, 595)">
    <rect x="0" y="0" width="170" height="38" rx="4" fill="#a4b494" />
    <text x="85" y="24" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#182015">SÉ PARTE HOY</text>
    <text x="195" y="24" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#e8dcc4">TODAS LAS SEMANAS</text>
  </g>

  <text x="80" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#a4b494">«El mayor entre vosotros será vuestro servidor»</text>
</svg>
